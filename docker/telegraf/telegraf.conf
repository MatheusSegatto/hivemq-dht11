[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# Entrada
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics  = ["${MQTT_TOPIC}"]
  client_id = "${MQTT_CLIENT_ID}"
  qos = 0

  # Payload de cada aluno:
  # {"sensor_id": "matheus", "temp": 25.3, "umid": 61.0}
  data_format = "json"
  name_override = "leituras"
  # sensor_id (nome do aluno) vira TAG -> cada aluno fica numa serie separada
  tag_keys = ["sensor_id"]

# Saida
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
